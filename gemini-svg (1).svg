     <text x="55" y="42" font-family="Arial, sans-serif" font-size="10" fill="#555555">Sector: Legal &amp; Serv. Jurídicos</text>
     <text x="55" y="57" font-family="Arial, sans-serif" font-size="10" fill="#555555">Fichado: <tspan font-weight="bold">Octubre 2025</tspan></text>
     
